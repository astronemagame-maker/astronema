name: Wallet registry deep scan

# Scan profond CollectChain (present -> genese) :
#   - registre wallet -> first_seen dans data/wallet_registry_deep.csv (commite)
#   - ARCHIVE de tous les transferts en archive/transfers_runNNN.csv.gz,
#     uploadee dans la Release "chain-archive" (pas commitee : pas de limite
#     100 Mo et le repo reste leger)
# Resumable : chaque run traite SCAN_MINUTES de pages, commit sa progression,
# puis SE RELANCE tout seul tant que la genese n'est pas atteinte
# (garde-fou : 40 runs max). Lancer avec reset=true pour repartir de zero.
#
# v3 blindage (lecon incident holders run#2 du 10/07) : un run cree/en file
# d'attente fige main au moment de sa CREATION -> checkout possiblement PERIME
# (sans le commit d'etat du run precedent) -> redemarrage de zero + clobber des
# archives. Corrections : (1) pull de main au DEMARRAGE ; (2) garde-fou : refus
# de demarrer sans etat si la Release chain-archive contient deja des tranches
# (sauf reset=true) ; (3) relance auto seulement si le run a reussi.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Budget de scan par run (minutes)"
        default: "280"
      auto_continue:
        description: "Se relance tout seul jusqu'a la genese"
        type: boolean
        default: true
      reset:
        description: "Repartir de zero (ignore l'etat existant)"
        type: boolean
        default: false
      purger_release:
        description: "AVEC reset : SUPPRIMER les tranches existantes de la Release chain-archive. OBLIGATOIRE pour un vrai repart-de-zero."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: veve-wallet-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Etat le plus recent (anti-checkout perime)
        run: git pull --rebase origin main

      - name: Garde-fou anti-retour-a-zero
        env:
          GH_TOKEN: ${{ github.token }}
          RESET: ${{ github.event.inputs.reset || 'false' }}
        run: |
          if [ "$RESET" = "true" ]; then echo "Reset demande - garde-fou ignore."; exit 0; fi
          if [ ! -f data/wallet_scan_state.json ] && gh release view chain-archive >/dev/null 2>&1; then
            echo "ERREUR: aucun etat local mais la Release chain-archive contient deja des tranches."
            echo "Checkout perime ou etat perdu - on refuse de repartir de zero (cela ecraserait les archives)."
            echo "Verifier data/wallet_scan_state.json sur main, ou relancer avec reset=true si voulu."
            exit 1
          fi
          echo "Garde-fou OK."

      # 🔴🔴 GARDE-FOU AJOUTE LE 05/08/2026 — UN RESET NE PURGE RIEN TOUT SEUL.
      #
      # `gh release upload --clobber` ecrase FICHIER PAR FICHIER, par nom. Un
      # reset qui produit 40 tranches la ou l'ancien scan en avait 30 remplace
      # run001..run030 et LAISSE run031..run040 de l'ancien. L'inverse aussi :
      # 30 neuves sur 40 anciennes laissent 10 orphelines.
      #
      # ⭐⭐⭐ UN RESET QUI NE PURGE PAS SA DESTINATION N'EST PAS UN RESET,
      # C'EST UNE SUPERPOSITION. Meme famille que « l'upload web GitHub
      # n'efface jamais rien » (paye le 18/07/2026) : l'outil applique ce qu'on
      # lui donne, il ne devine pas ce qu'on voulait remplacer.
      #
      # ⛔ POURQUOI CA COMPTE MAINTENANT : le correctif `system_transfer` du
      # 05/08 rend l'ancienne archive FAUSSE sur 216 838 transferts (26,9 % du
      # « market »). Un reset qui laisse des tranches anciennes melange les
      # bonnes et les mauvaises lignes — et la dedup par (block, log_index)
      # de `merge_transfers` garde la PREMIERE lue, pas la plus juste.
      # ⭐⭐ DEUX SOURCES QUI SE RECOUVRENT MAL NE PRODUISENT PAS UNE ERREUR,
      # ELLES PRODUISENT UNE MOYENNE.
      #
      # ⛔ LA PURGE RESTE UN GESTE EXPLICITE. Elle n'est pas automatique avec
      # `reset` : effacer 30 tranches de scan represente des heures de
      # collecte. Le workflow REFUSE simplement de faire un reset silencieux.
      - name: "Reset sans purge = REFUS (anti-superposition)"
        if: ${{ github.event.inputs.reset == 'true' && github.event.inputs.purger_release != 'true' }}
        run: |
          echo "⛔ reset=true SANS purger_release=true."
          echo ""
          echo "Un reset repart de run001, mais --clobber n'ecrase que les noms"
          echo "qu'il reecrit : les tranches anciennes au-dela du nouveau compte"
          echo "RESTERAIENT dans la Release, avec leurs kind d'avant le correctif."
          echo ""
          echo "  * repart-de-zero PROPRE  -> reset=true ET purger_release=true"
          echo "  * simple reprise         -> reset=false (defaut)"
          exit 1

      - name: "Purge de la Release chain-archive (reset propre)"
        if: ${{ github.event.inputs.reset == 'true' && github.event.inputs.purger_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view chain-archive >/dev/null 2>&1; then
            echo "Pas de Release chain-archive — rien a purger."; exit 0
          fi
          # ⭐ On compte AVANT et APRES : une purge qui ne supprime rien et une
          # purge sur une Release deja vide s'impriment pareil.
          avant=$(gh release view chain-archive --json assets \
                  --jq '.assets | length')
          echo "Tranches presentes : $avant"
          gh release view chain-archive --json assets --jq '.assets[].name' \
            | while read -r a; do
                echo "  suppression $a"
                gh release delete-asset chain-archive "$a" -y || exit 1
              done
          apres=$(gh release view chain-archive --json assets \
                  --jq '.assets | length')
          echo "Tranches restantes : $apres"
          if [ "$apres" != "0" ]; then
            echo "⛔ La purge a laisse $apres tranche(s) — on s'arrete plutot"
            echo "   que de superposer du neuf sur de l'ancien."
            exit 1
          fi
          echo "✅ Release vide — le scan repart sur une base saine."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔴 AJOUTÉ LE 07/08/2026 — TÉMOIN DE PROGRESSION.
      # On relit `pages` AVANT le scan pour pouvoir répondre, APRÈS, à une
      # question que `success()` ne pose pas : « ce run a-t-il avancé ? »
      - name: "Pages avant scan (temoin)"
        id: avant
        run: |
          P=$(python -c "import json;print(json.load(open('data/wallet_scan_state.json')).get('pages',0))" 2>/dev/null || echo 0)
          echo "pages=$P" >> "$GITHUB_OUTPUT"
          echo "Pages cumulees avant ce run : $P"

      # 🔴🔴 AJOUTÉ LE 13/08/2026 — LE NOM DE LA TRANCHE NE DOIT PLUS DÉPENDRE
      # D'UN COMPTEUR INTERNE. `run_id` est unique par construction et stable
      # à travers un re-run, ce qui est exactement le comportement voulu :
      # deux runs distincts ne peuvent plus écrire le même fichier, un re-run
      # réécrit le sien.
      - name: "Tranches en Release AVANT ce run (témoin)"
        id: tranches_avant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view chain-archive --json assets \
            --jq '.assets[]|select(.name|endswith(".csv.gz"))|.name' \
            > /tmp/tranches_avant.txt 2>/dev/null || : > /tmp/tranches_avant.txt
          N=$(wc -l < /tmp/tranches_avant.txt)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Tranches deja publiees : $N"

      - name: Deep scan (tranche)
        env:
          SCAN_MINUTES: ${{ github.event.inputs.minutes || '280' }}
          SCAN_RESET: ${{ github.event.inputs.reset || 'false' }}
          SCAN_ARCHIVE_TAG: gh${{ github.run_id }}
        run: python -m scraper.wallet_scan

      # 🔴 AJOUTÉ LE 07/08/2026 — COMPTEUR QUI SURVIT À L'ANNULATION.
      # `state["runs"]` n'est incrémenté qu'à la SORTIE PROPRE de la boucle
      # Python : un run annulé n'y apparaît jamais. Le garde-fou « 40 runs »
      # ne comptait donc que les runs réussis et ne pouvait pas plafonner une
      # série d'annulations. ⭐⭐ Un compteur qui ne compte que les succès ne
      # protège de rien : ce sont les échecs qui bouclent.
      - name: "Compteur de relances (survit aux annulations)"
        if: ${{ always() }}
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/wallet_scan_state.json")
          if p.exists():
              s = json.loads(p.read_text())
              s["relances"] = int(s.get("relances", 0)) + 1
              p.write_text(json.dumps(s))
              print("relances =", s["relances"])
          else:
              print("Pas d'etat — rien a compter.")
          EOF

      - name: Upload archive (Release chain-archive)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls archive/*.csv.gz >/dev/null 2>&1 || { echo "Pas d'archive a uploader."; exit 0; }
          gh release view chain-archive >/dev/null 2>&1 || \
            gh release create chain-archive --title "Archive transferts CollectChain" \
              --notes "CSV.gz par tranche de scan. Colonnes: block,log_index,ts_utc,date_pt,kind,category,veve_uuid,edition,from,to,token_id. Dedup par (block,log_index). token_id ajoute le 05/08/2026 (11e colonne, EN FIN) : il identifie les mints dont la metadonnee n'existe pas encore, donc sans veve_uuid."
          gh release upload chain-archive archive/*.csv.gz --clobber
          echo "Archive uploadee :" && ls -lh archive/

      # 🔴🔴 AJOUTÉ LE 13/08/2026 — LE GARDE-FOU QUI MANQUAIT.
      # 400 000 transferts (blocs 5138-5255, contigus) ont disparu de la
      # Release sans qu'un seul run rougisse : une tranche déjà publiée a été
      # remplacée par une autre portant le même nom.
      # ⭐⭐ IL COMPTE, IL NE DÉDUIT PAS : il relit la liste réelle des noms
      # avant et après, et calcule combien de tranches NEUVES ce run apporte.
      # Un re-run qui réécrit sa propre tranche n'apporte rien de neuf et reste
      # vert ; un run qui écrase la tranche d'un AUTRE run fait chuter le
      # total et devient rouge.
      - name: "🔴 INVARIANT : aucune tranche publiée ne disparaît"
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls archive/*.csv.gz >/dev/null 2>&1; then
            echo "Ce run n'a produit aucune tranche — invariant SANS OBJET."
            echo "(Ce n'est pas un succes : c'est une absence de sujet.)"
            exit 0
          fi
          # 🔴🔴 CE CONTRÔLE-CI EXISTE PARCE QUE MES PROPRES MUTANTS L'ONT
          # EXIGÉ. Sans lui, le scénario EXACT du 13/08 — une tranche déjà
          # publiée réécrite par un autre run — sortait VERT : le compte de
          # tranches ne bouge pas, et rien ne distingue cette collision d'un
          # re-run légitime.
          # ⭐⭐⭐ Le nommage par run_id EMPÊCHE la collision ; ce contrôle
          # vérifie que le nommage a bien eu lieu. Retirer l'un sans l'autre
          # rouvre la porte en silence — et une omission ne se lit dans aucun
          # diff.
          for f in archive/*.csv.gz; do
            case "$(basename "$f")" in
              *gh${{ github.run_id }}*) ;;
              *) echo "⛔ Tranche « $(basename "$f") » ne porte pas l'identifiant"
                 echo "   de ce run (gh${{ github.run_id }}). SCAN_ARCHIVE_TAG n'a pas"
                 echo "   ete transmis : deux runs peuvent de nouveau ecrire le meme"
                 echo "   nom, et la moisson de l'un remplacer celle de l'autre."
                 exit 1 ;;
            esac
          done
          echo "✅ Toutes les tranches portent l'identifiant de ce run."
          AV=$(wc -l < /tmp/tranches_avant.txt)
          NEUVES=0
          for f in archive/*.csv.gz; do
            n=$(basename "$f")
            grep -Fxq "$n" /tmp/tranches_avant.txt || NEUVES=$((NEUVES + 1))
          done
          gh release view chain-archive --json assets \
            --jq '[.assets[]|select(.name|endswith(".csv.gz"))]|length' > /tmp/ap.txt
          AP=$(cat /tmp/ap.txt)
          ATTENDU=$((AV + NEUVES))
          echo "tranches avant=$AV · neuves apportees=$NEUVES · attendu=$ATTENDU · reel=$AP"
          if [ "$AP" -ne "$ATTENDU" ]; then
            echo "⛔ $((ATTENDU - AP)) tranche(s) publiee(s) ont DISPARU de la Release."
            echo "   Une moisson deja acquise vient d'etre remplacee."
            echo "   ⛔ NE PAS RELANCER le scan avant d'avoir lu quelles tranches manquent."
            exit 1
          fi
          echo "✅ Aucune tranche publiee n'a ete perdue."

      - name: Commit de la progression
        if: ${{ always() }}
        run: |
          git config user.name "veve-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wallet_registry_deep.csv data/wallet_scan_state.json
          if git diff --cached --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "wallet-scan: progression $(date -u +%FT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

      # 🔴🔴 RÉÉCRIT LE 07/08/2026 — LE RUN #52 A ÉTÉ *CANCELED* À 3 h 52,
      # DONC `success()` ÉTAIT FAUX, DONC LA RELANCE N'A PAS EU LIEU.
      # L'archive et le commit sont passés (ils sont en `always()`), la
      # progression était intacte : la chaîne s'est arrêtée alors que RIEN
      # n'était cassé — et rien ne l'a signalé.
      #
      # ⭐⭐⭐ `success()` RÉPOND « LE RUN S'EST-IL BIEN TERMINÉ ? », PAS
      # « LE TRAVAIL A-T-IL AVANCÉ ? ». Sur un collecteur repris par
      # checkpoints, c'est la seconde question qui décide, et elle se MESURE :
      # pages_après > pages_avant. Une annulation d'infra devient alors un
      # incident sans conséquence, et un vrai plantage (0 page) n'entraîne
      # aucune relance — le garde-fou anti-boucle est la mesure elle-même,
      # pas une condition de statut.
      #
      # ⛔ ARRÊT MANUEL : créer le fichier `data/STOP_SCAN` sur main. C'est le
      # seul moyen d'interrompre la chaîne à la main, puisque annuler un run
      # ne l'arrête plus.
      - name: Relance auto si le run a AVANCE
        if: ${{ always() && github.event.inputs.auto_continue != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AVANT: ${{ steps.avant.outputs.pages }}
        run: |
          if [ -f data/STOP_SCAN ]; then
            echo "⛔ data/STOP_SCAN present — arret demande a la main."; exit 0
          fi
          DONE=$(python -c "import json; print(json.load(open('data/wallet_scan_state.json')).get('done', False))" 2>/dev/null || echo "")
          APRES=$(python -c "import json; print(json.load(open('data/wallet_scan_state.json')).get('pages', 0))" 2>/dev/null || echo 0)
          RELANCES=$(python -c "import json; print(json.load(open('data/wallet_scan_state.json')).get('relances', 0))" 2>/dev/null || echo 0)
          echo "pages : $AVANT -> $APRES   (relances cumulees : $RELANCES)"
          if [ "$DONE" = "True" ]; then
            echo "✅ Genese atteinte — pas de relance."; exit 0
          fi
          if [ "${APRES:-0}" -le "${AVANT:-0}" ]; then
            echo "⛔ AUCUNE progression sur ce run ($AVANT -> $APRES)."
            echo "   Relance suspendue : relancer en boucle un scan qui n'avance"
            echo "   pas ne fait que repeter la panne. Regarder le log ci-dessus."
            exit 0
          fi
          if [ "${RELANCES:-0}" -ge 60 ]; then
            echo "⛔ Garde-fou : 60 tranches lancees — chaine stoppee."
            echo "   Verifier l'estimation restante avant de repartir."
            exit 0
          fi
          echo "Scan incomplet mais en progression — relance..."
          gh workflow run wallet-scan.yml --ref main \
            -f minutes="${{ github.event.inputs.minutes || '280' }}" \
            -f auto_continue=true -f reset=false
